# Classic Commander — the shipped default, and the palette dimnav has always
# drawn. Carries both variants and pins neither, so it follows the OS the way
# the stylesheet's `prefers-color-scheme` block used to.

name = "Classic Commander"

[dark]
bg = "#1e1e22"
bg-alt = "#26262b"
fg = "#d8d8dc"
fg-dim = "#8a8a92"
border = "#34343a"
accent = "#3b7dd8"
accent-fg = "#ffffff"
accent-dim = "rgba(59, 125, 216, 0.35)"

# Folders light blue, symlinks lighter still, dotfiles grey but legible.
file-dir = "#6fb3e0"
file-symlink = "#a6d8ff"
file-hidden = "#8a8a92"
file-doc = "#c98a6a"
file-data = "#4f8f6b"
file-code = "#3b7dd8"
file-archive = "#c07ad8"
file-image = "#d87aa8"
file-media = "#6fd0c8"
file-exec = "#8fd18f"
file-selected = "#ffd633"

term-idle = "#8a8a92"
term-run = "#e0c04a"
term-ok = "#6fbf73"
term-err = "#d86b6b"

[light]
bg = "#fbfbfa"
bg-alt = "#f0f0ee"
fg = "#23232a"
fg-dim = "#6a6a72"
border = "#dcdcd8"
accent = "#2f6fce"
accent-fg = "#ffffff"
accent-dim = "rgba(47, 111, 206, 0.35)"

# Darker variants, for contrast against the light background.
file-dir = "#2f6fce"
file-symlink = "#5a9fe0"
file-hidden = "#8a8a92"
file-doc = "#a85a3a"
file-data = "#2f6b4a"
file-code = "#2f6fce"
file-exec = "#3f9b52"
file-archive = "#7a3fa0"
file-image = "#a63f70"
file-media = "#2f8f86"
file-selected = "#a67c00"

term-idle = "#8a8a92"
term-run = "#b8890f"
term-ok = "#3f9b52"
term-err = "#c0392b"
