# Pinned so a release built on CI is bit-for-bit reproducible against a local
# build. Apple Silicon only — releases ship a single arm64 slice, and CI runs on
# arm64 runners, so this is the host target rather than a cross-compile.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
targets = ["aarch64-apple-darwin"]
