name: Deploy site

on:
  push:
    branches: [main]
    # Only rebuild when the site itself changes; a Rust-only commit has no
    # bearing on it. The download button reads the release feed at runtime, so
    # publishing a release does not require redeploying the page either.
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so the last commit
# always ends up being the one that is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Plain static files — no generator, no build step. Uploading the
      # subdirectory directly is what keeps docs/ (SPEC.md, FEATURES.md) out of
      # the published site without needing a gh-pages branch.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
