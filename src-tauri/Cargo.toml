[package]
name = "file-manager"
# The crate name stays `file-manager`; the product is named in tauri.conf.json.
# `description`, `homepage`, `repository` and `license` below are read back at
# runtime via env!("CARGO_PKG_*") to populate the Help → About topic, so they are
# user-visible strings, not just packaging metadata.
description = "Keyboard-first two-panel file manager for macOS"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
# Only one binary — `export_bindings` is an example, because Tauri's bundler
# copies every bin target into the .app, and a bindings exporter has no business
# shipping there. Kept anyway so `cargo run` stays unambiguous if a bin is added.
default-run = "dimnav"

# The `_lib` suffix keeps the lib name distinct from the bin (a Windows quirk;
# see https://github.com/rust-lang/cargo/issues/8519).
[lib]
name = "file_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Named for the product, not the crate: this becomes CFBundleExecutable, so it is
# what Activity Monitor, `ps`, and crash reports display. Left as `file-manager`
# it leaks the old name everywhere the .app's contents are visible.
[[bin]]
name = "dimnav"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` lets the embedded viewer render an image straight from disk
# via `convertFileSrc`, gated by the `assetProtocol` scope in tauri.conf.json.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"

# Signed in-app updates, verified against the public key in tauri.conf.json and
# served from the GitHub release feed.
tauri-plugin-updater = "2"

serde = { workspace = true }
serde_json = "1"

# Cross-platform "Move to Trash" (F8). On macOS this uses the native
# NSFileManager trashItem API, so deleted items land in the real Trash and stay
# Finder-restorable — the app never reimplements trashing itself (§5.4a).
trash = "5"

# Typed IPC contract stack: DTOs are exported to TypeScript from the Rust
# definitions so the frontend never hand-writes command/event signatures.
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }

# The platform-agnostic core. This is the ONLY place Tauri and fm-core meet.
fm-core = { path = "../crates/fm-core" }

# Ctrl+C in the terminal signals the command's whole process group, so the
# program the shell started dies too and not just the shell (§5.7). Unix-only;
# gated so a future Windows build never sees it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
